---
- name: Verify the Grafana deployment
  hosts: monitoring
  become: true
  gather_facts: false

  pre_tasks:
    - name: Ensure the Grafana administrator password is available
      ansible.builtin.assert:
        that:
          - vault_grafana_admin_password is defined
          - vault_grafana_admin_password | trim | length > 0
        fail_msg: >-
          Define vault_grafana_admin_password in
          ansible/group_vars/monitoring/vault.yml using Ansible Vault.
      no_log: true

  tasks:
    - name: Check Grafana health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_port }}/api/health"
        method: GET
        status_code: 200
        return_content: true
        timeout: 5
      register: grafana_health_check
      failed_when: >-
        grafana_health_check.status != 200
        or (grafana_health_check.json.database | default('')) != 'ok'
      changed_when: false

    - name: Check provisioned Grafana datasources
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:{{ grafana_port }}/api/datasources/uid/{{ item.uid }}
        method: GET
        url_username: "{{ grafana_admin_user }}"
        url_password: "{{ vault_grafana_admin_password }}"
        force_basic_auth: true
        status_code: 200
        return_content: true
        timeout: 5
      register: grafana_datasource_check
      failed_when: >-
        grafana_datasource_check.status != 200
        or grafana_datasource_check.json.url != item.url
      changed_when: false
      no_log: true
      loop:
        - uid: "{{ grafana_prometheus_datasource_uid }}"
          url: "{{ grafana_prometheus_url }}"
        - uid: "{{ grafana_loki_datasource_uid }}"
          url: "{{ grafana_loki_url }}"

    - name: Check provisioned Grafana dashboards
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:{{ grafana_port }}/api/dashboards/uid/{{ item.uid }}
        method: GET
        url_username: "{{ grafana_admin_user }}"
        url_password: "{{ vault_grafana_admin_password }}"
        force_basic_auth: true
        status_code: 200
        timeout: 5
      changed_when: false
      no_log: true
      loop: "{{ grafana_dashboards }}"
      loop_control:
        label: "{{ item.uid }}"

    - name: Check that Grafana can query Prometheus
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:{{ grafana_port }}/api/datasources/uid/{{
            grafana_prometheus_datasource_uid
          }}/health
        method: GET
        url_username: "{{ grafana_admin_user }}"
        url_password: "{{ vault_grafana_admin_password }}"
        force_basic_auth: true
        status_code: 200
        return_content: true
        timeout: 5
      register: grafana_prometheus_health_check
      failed_when: >-
        grafana_prometheus_health_check.status != 200
        or (grafana_prometheus_health_check.json.status | default('')) != 'OK'
      changed_when: false
      no_log: true

---
prometheus_image: prom/prometheus:v3.14.0
prometheus_container_name: prometheus
prometheus_network_name: monitoring
prometheus_container_port: 9090
prometheus_container_uid: "65534"
prometheus_container_gid: "65534"
prometheus_config_filename: prometheus.yml
prometheus_rules_filename: alert.rules.yml
prometheus_rules_test_filename: alert.rules.test.yml

prometheus_config_dir: /etc/prometheus
prometheus_data_dir: /var/lib/prometheus
prometheus_config_path: >-
  {{ prometheus_config_dir }}/{{ prometheus_config_filename }}
prometheus_rules_dir: "{{ prometheus_config_dir }}/rules"
prometheus_rules_path: >-
  {{ prometheus_rules_dir }}/{{ prometheus_rules_filename }}
prometheus_rules_test_path: >-
  {{ prometheus_rules_dir }}/{{ prometheus_rules_test_filename }}
prometheus_secrets_dir: "{{ prometheus_config_dir }}/secrets"
prometheus_application_password_path: >-
  {{ prometheus_secrets_dir }}/application-basic-auth-password

prometheus_bind_address: 0.0.0.0
prometheus_port: 9090
prometheus_ssh_port: 22
prometheus_ui_allowed_cidrs:
  - 0.0.0.0/0

prometheus_scrape_interval: 15s
prometheus_evaluation_interval: 15s
prometheus_retention_time: 15d
prometheus_readiness_retries: 30
prometheus_readiness_delay: 2

# All scrape targets are generated from inventory and shared group variables.
# Add future Nginx exporter and Loki-related jobs to this list.
prometheus_scrape_jobs:
  - job_name: prometheus
    metrics_path: /metrics
    targets:
      - "127.0.0.1:{{ prometheus_container_port }}"
  - job_name: node_exporter
    metrics_path: /metrics
    targets:
      - >-
        {{ hostvars[groups['app'][0]].private_ip }}:{{ node_exporter_port }}
  - job_name: application
    metrics_path: /actuator/prometheus
    basic_auth: true
    targets:
      - >-
        {{ hostvars[groups['app'][0]].private_ip }}:{{ monitoring_proxy_port }}

# Grafana runs beside Prometheus in the same Docker network. The image version
# is pinned so repeated deployments are predictable.
grafana_image: grafana/grafana:13.2.2
grafana_container_name: grafana
grafana_network_name: "{{ prometheus_network_name }}"
grafana_container_port: 3000
grafana_container_uid: "472"
grafana_container_gid: "472"

grafana_bind_address: 0.0.0.0
grafana_port: 3000
grafana_admin_user: admin
grafana_ui_allowed_cidrs:
  - 0.0.0.0/0

grafana_config_dir: /etc/grafana
grafana_provisioning_dir: "{{ grafana_config_dir }}/provisioning"
grafana_datasources_dir: "{{ grafana_provisioning_dir }}/datasources"
grafana_dashboard_providers_dir: "{{ grafana_provisioning_dir }}/dashboards"
grafana_dashboards_host_dir: "{{ grafana_config_dir }}/dashboards"
grafana_dashboards_container_dir: /etc/grafana/dashboards
grafana_data_dir: /var/lib/grafana
grafana_secrets_dir: "{{ grafana_config_dir }}/secrets"
grafana_admin_password_path: "{{ grafana_secrets_dir }}/admin-password"
grafana_admin_password_container_path: /run/secrets/grafana-admin-password

grafana_prometheus_url: >-
  http://{{ prometheus_container_name }}:{{ prometheus_container_port }}
grafana_prometheus_datasource_name: Prometheus
grafana_prometheus_datasource_uid: prometheus
grafana_loki_url: http://loki:3100
grafana_loki_datasource_name: Loki
grafana_loki_datasource_uid: loki
grafana_datasources_filename: datasources.yml
grafana_dashboard_provider_filename: dashboards.yml
grafana_dashboard_provider_name: project-observability
grafana_dashboard_folder: Observability
grafana_dashboards_update_interval: 30
grafana_readiness_retries: 30
grafana_readiness_delay: 2

grafana_dashboards:
  - filename: system-overview.json
    uid: system-overview
  - filename: application-overview.json
    uid: application-overview
  - filename: http-performance.json
    uid: http-performance
